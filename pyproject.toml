[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raavi-tts"
version = "2.1.0"
description = "Advanced Persian Speech & Audiobook Studio — Hybrid ONNX Engine, Voice Cloning, and Batch Processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hamid Morsali", email = "hamid-morsali-786@users.noreply.github.com" },
]
keywords = [
    "tts",
    "text-to-speech",
    "persian",
    "farsi",
    "onnx",
    "voice-cloning",
    "audiobook",
    "gemini-tts",
    "fastapi",
    "deep-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnxruntime>=1.19",
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "sentencepiece>=0.2.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "google-genai>=0.1.1",
    "pedalboard>=0.9.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "env",
    "model",
    "output",
    "uploads",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
