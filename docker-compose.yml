services:
  raavi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raavi-tts
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RAAVI_HOST=0.0.0.0
      - RAAVI_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./model:/app/model
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./voices:/app/voices
